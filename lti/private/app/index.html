<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Aivel · закрытая программа мотивации</title>
    <script>
      const target = new URL("../", window.location.href);
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.href);
    </script>
  </head>
  <body>
    <p>Открываем защищённую страницу…</p>
    <noscript><p>Для открытия защищённой страницы требуется JavaScript.</p></noscript>
  </body>
</html>
