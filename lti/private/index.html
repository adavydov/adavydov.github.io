<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; worker-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
    />
    <title>Aivel · закрытая программа мотивации</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7fa; color: #0f1722; }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 14% 0%, #e3efff 0, transparent 34%), #f5f7fa; }
      main { width: min(100%, 480px); border: 1px solid rgba(15, 23, 34, .08); border-radius: 28px; background: rgba(255,255,255,.94); padding: 32px; box-shadow: 0 24px 70px rgba(15, 23, 34, .10); }
      .mark { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; background: #0a66d6; color: white; font-weight: 750; letter-spacing: -.04em; }
      .eyebrow { margin: 28px 0 0; color: rgba(15,23,34,.48); font-size: 11px; font-weight: 750; letter-spacing: .11em; text-transform: uppercase; }
      h1 { margin: 10px 0 0; font-size: clamp(32px, 8vw, 44px); line-height: 1.04; letter-spacing: -.045em; }
      .lead { margin: 16px 0 0; color: rgba(15,23,34,.68); font-size: 16px; line-height: 1.55; }
      form { margin-top: 28px; }
      label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; }
      .password-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      input { width: 100%; min-height: 50px; border: 1px solid rgba(15,23,34,.16); border-radius: 14px; padding: 0 15px; background: #fff; color: #0f1722; font: inherit; outline: none; }
      input:focus { border-color: #0a66d6; box-shadow: 0 0 0 3px rgba(10,102,214,.12); }
      button { min-height: 50px; border: 0; border-radius: 14px; padding: 0 18px; background: #0f1722; color: #fff; font: inherit; font-weight: 750; cursor: pointer; }
      button:hover { background: #0a66d6; }
      button:disabled { cursor: wait; opacity: .58; }
      .status { min-height: 21px; margin: 12px 0 0; color: rgba(15,23,34,.58); font-size: 13px; line-height: 1.55; }
      .status.error { color: #b42318; }
      .security { margin: 22px 0 0; padding-top: 18px; border-top: 1px solid rgba(15,23,34,.08); color: rgba(15,23,34,.46); font-size: 12px; line-height: 1.55; }
      @media (max-width: 520px) { main { padding: 24px; border-radius: 22px; } .password-row { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">A</div>
      <p class="eyebrow">Aivel · закрытый материал</p>
      <h1>Система мотивации</h1>
      <p class="lead">Введите пароль, чтобы расшифровать страницу в этом браузере. Содержимое не передаётся на сервер в открытом виде.</p>
      <form id="unlock-form">
        <label for="password">Пароль просмотра</label>
        <div class="password-row">
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
          <button id="unlock" type="submit">Открыть</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
      <p class="security">Пароль используется локально для AES-256-GCM расшифровки. GitHub хранит только зашифрованный файл.</p>
    </main>
    <script src="./loader.js" defer></script>
  </body>
</html>
